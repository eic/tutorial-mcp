<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="160" height="100" role="img" aria-label="gold ring engraved with the word EIC in glowing fiery letters">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffedb0"/>
      <stop offset="45%" stop-color="#e9b64d"/>
      <stop offset="100%" stop-color="#96661e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd76e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd76e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6c8"/>
      <stop offset="45%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#e0491f"/>
    </linearGradient>
    <filter id="heat" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <path id="band" d="M 26,50 A 54,22 0 0 1 134,50" fill="none"/>
  </defs>
  <ellipse cx="80" cy="50" rx="74" ry="44" fill="url(#glow)"/>
  <ellipse cx="80" cy="50" rx="54" ry="22" fill="none" stroke="url(#gold)" stroke-width="17"/>
  <ellipse cx="80" cy="42" rx="54" ry="22" fill="none" stroke="#fff3c9" stroke-width="1.6" opacity="0.75"/>
  <ellipse cx="80" cy="58.5" rx="54" ry="22" fill="none" stroke="#6b4212" stroke-width="1.4" opacity="0.55"/>
  <text transform="translate(0 -1.5) scale(1 1.22)" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="bold"
        font-size="11" letter-spacing="1" fill="#ff5a1f" opacity="0.9" filter="url(#heat)">
    <textPath href="#band" startOffset="50%" text-anchor="middle">✦ EIC ✦</textPath>
  </text>
  <text transform="translate(0 -1.5) scale(1 1.22)" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="bold"
        font-size="11" letter-spacing="1" fill="url(#fire)">
    <textPath href="#band" startOffset="50%" text-anchor="middle">✦ EIC ✦</textPath>
  </text>
</svg>
